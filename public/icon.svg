      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
