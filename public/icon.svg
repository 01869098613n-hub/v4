  <text x="300" y="270" font-size="110" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">🐯</text>
  <text x="256" y="360" font-size="36" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4">APEX</text>
